[pytest]
# Modules under src/ use bare imports (e.g. "from file.collector import ...",
# matching how src/cli.py itself is run: `python src/cli.py`, which puts src/
# on sys.path[0]). Adding src/ to pythonpath here reproduces that for tests
# without every test file hand-rolling a sys.path hack.
pythonpath = src
testpaths = tests
